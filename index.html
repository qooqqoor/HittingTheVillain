<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出氣擂台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面:直式手遊一欄。上方資源列、中間直式舞台、下方武器快捷列與開罵列;角色設定收在底部抽屜。單一奶油色遊戲風,不分深淺主題。 */
:root{
  color-scheme:light;
  --bg:#f1e3c2; --bg2:#fff7df; --panel:#fffaf0; --panel2:#f3e4c2; --ink:#2b2030; --mute:#7a6a5a;
  --gold:#ffc83a; --gold-d:#e08a00; --hit:#ff3d5a; --hit-d:#b3183a; --cool:#3aa0ff; --ok:#35d07f; --light:#fff8e6;
  --display:"Bangers","Noto Sans TC",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
[hidden]{display:none!important}
h1,.combo,.pop,.slam,.cutin b,.dizzy,.rank,.ult,.pill b{paint-order:stroke fill}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--bg) radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 75%) fixed;color:var(--ink);font:500 15px/1.5 var(--body)}
.app{max-width:592px;height:100%;min-height:520px;margin:0 auto;padding-inline:16px;padding-block:8px 8px;display:flex;flex-direction:column;gap:7px}
.app>*{flex:none;min-width:0;max-width:100%}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cool);outline-offset:2px}

/* 立體按鈕 */
.btn{background:linear-gradient(#fff,var(--panel2));border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:900;box-shadow:0 4px 0 var(--ink);color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.gold{background:linear-gradient(#ffe88a,var(--gold))}
.btn.red{background:linear-gradient(#ffb3a6,#ff7f73);color:var(--ink)}
.btn.big{font-size:19px;padding:9px 26px;border-radius:16px}

/* 上方列 */
.top{display:flex;align-items:center;gap:6px}
.top .btn{padding:4px 10px;flex:none}
.top .pill{flex:0 1 auto;min-width:0}
h1{margin:0;font:900 24px/1 var(--body);letter-spacing:.04em;color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 3px 0 var(--ink);margin-right:auto;white-space:nowrap;flex:1 1 0;min-width:0;overflow:hidden}
.pill{display:flex;align-items:center;gap:6px;background:var(--ink);border:2.5px solid var(--gold);border-radius:99px;padding:2px 12px 2px 4px;font-weight:900;color:var(--light);white-space:nowrap}
.pill i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(#ffe88a,var(--gold-d));border:2px solid var(--ink);color:var(--ink);font-size:13px}
.pill b{font:400 20px/1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}

/* 舞台 */
.stage{position:relative;flex:1 1 0!important;min-height:0;max-height:calc((min(100vw,592px) - 32px)*1.7);width:100%;border:4px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink),0 0 0 3px var(--gold) inset;overflow:hidden;container-type:size;background:#cfe3ea;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage .scene{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:6;color:var(--ink)}
.hprow{display:flex;align-items:center;gap:8px}
.hprow .nm{font-weight:900;font-size:14px;background:var(--panel);border:2.5px solid var(--ink);border-radius:8px;padding:1px 8px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{position:relative;flex:1;height:18px;border:2.5px solid var(--ink);background:#3a3350;border-radius:99px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.hp i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:99px}
.hp .ghost{background:#fff;transition:width .5s .3s}
.hp .bar{background:linear-gradient(#8dffbf,var(--ok));transition:width .15s}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font:400 14px/1 var(--display);color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink);letter-spacing:.06em}
.chip{align-self:flex-start;background:rgba(27,21,48,.78);color:var(--light);border-radius:99px;padding:1px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.combo{position:absolute;top:74px;left:12px;z-index:6;pointer-events:none;font:400 38px/1 var(--display);color:var(--gold);-webkit-text-stroke:4px var(--ink);text-shadow:0 4px 0 var(--ink);transform-origin:0 50%}
.combo small{font:900 15px/1 var(--body);-webkit-text-stroke:3px var(--ink);margin-left:4px}

/* 對方(Q版) */
.foe{position:absolute;left:50%;bottom:17%;width:min(48cqw,40cqh);aspect-ratio:3/4;translate:-45% 0;z-index:3;transform-origin:50% 75%;transition:transform .4s cubic-bezier(.5,1.5,.5,1)}
.foeIn,.foeIdle{position:absolute;inset:0;transform-origin:50% 100%}
.foeIdle{animation:breathe 1.3s ease-in-out infinite alternate}
.foe.s3 .foeIdle{animation:shiver .1s linear infinite alternate}
.foe.ko .foeIdle{animation:none}
.foe.ko{transform:rotate(90deg)}
@keyframes breathe{to{transform:translateY(-1.5%) scale(1.01,1.025)}}
@keyframes shiver{from{transform:translateX(-1.2%)}to{transform:translateX(1.2%)}}
.shadow{position:absolute;left:14%;right:14%;bottom:-3%;height:8%;background:rgba(27,21,48,.35);border-radius:50%}
.foe .head{position:absolute;left:11%;top:0;width:78%;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);overflow:hidden;background:#ffd9b3;z-index:2;transition:filter .3s}
.av img,.av svg{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.foe .torso{position:absolute;left:29%;top:54%;width:42%;height:31%;background:#6c7cff;border:4px solid var(--ink);border-radius:38% 38% 26% 26%}
.foe .tie{position:absolute;left:46%;top:60%;width:8%;height:17%;background:var(--hit);clip-path:polygon(50% 0,100% 20%,70% 100%,30% 100%,0 20%);z-index:1}
.foe .arm{position:absolute;top:58%;width:12%;height:22%;background:#6c7cff;border:4px solid var(--ink);border-radius:40%;transition:transform .25s,top .25s}
.foe .arm.l{left:19%;transform:rotate(22deg)} .foe .arm.r{right:19%;transform:rotate(-22deg)}
.foe .leg{position:absolute;top:82%;width:15%;height:17%;background:#3b3558;border:4px solid var(--ink);border-radius:20% 20% 45% 45%}
.foe .leg.l{left:32%} .foe .leg.r{right:32%}
.foe.f .torso{background:#ff6f9f;border-radius:36% 36% 12% 12%;height:27%}
.foe.f .torso::after{content:"";position:absolute;left:-22%;right:-22%;top:86%;height:52%;background:#7a4bd0;border:4px solid var(--ink);border-radius:18% 18% 30% 30%;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}
.foe.f .torso.art::after{display:none}
.foe.f .arm{background:#ff6f9f;width:10%}
.foe.f .leg{background:#ffd9b3;width:11%;border-radius:20% 20% 40% 40%}
.foe.f .leg.l{left:35%}.foe.f .leg.r{right:35%}
.foe.f .tie{display:none}
.foe .arm,.foe .leg{transform-origin:50% 9%}
.foe .arm.l{animation:swayL 1.7s ease-in-out infinite alternate}.foe .arm.r{animation:swayR 1.7s ease-in-out infinite alternate}
@keyframes swayL{to{rotate:7deg}}@keyframes swayR{to{rotate:-7deg}}
.foe.ko .arm,.foe.frozen .arm{animation:none}
.foe.beg .arm.l{transform:rotate(158deg)} .foe.beg .arm.r{transform:rotate(-158deg)}
.wounds{position:absolute;inset:0;z-index:4;pointer-events:none}
.wounds span{position:absolute;width:24%;aspect-ratio:1}
.wounds svg{width:100%;height:100%;overflow:visible}
.x{position:absolute;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s}
.sweat{left:84%;top:5%;width:9%;aspect-ratio:2/3;background:#7fd0ff;border:2.5px solid var(--ink);border-radius:50%/65% 65% 35% 35%;animation:drip .8s infinite}
.tear{top:27%;width:7%;height:20%;background:linear-gradient(#dff4ff,#58b8ff);border:2.5px solid var(--ink);border-radius:30% 30% 50% 50%;animation:tear .35s infinite alternate}
.tear.l{left:31%} .tear.r{left:62%}
.dizzy{left:0;right:0;top:-15%;text-align:center;font:900 24px/1 var(--body);color:var(--gold);-webkit-text-stroke:4px var(--ink);letter-spacing:.3em;animation:orbit .7s infinite alternate}
.foe.s1 .sweat,.foe.s2 .tear,.foe.s3 .dizzy{opacity:1}
.afro{left:2%;top:-14%;width:96%;aspect-ratio:1.7;background:#221c1c;border-radius:50% 50% 38% 38%;z-index:3;transform:scale(.2);transform-origin:50% 100%;transition:opacity .2s,transform .3s cubic-bezier(.5,1.9,.5,1)}
.afro::before,.afro::after{content:"";position:absolute;bottom:-12%;width:34%;aspect-ratio:1;border-radius:50%;background:#221c1c}
.afro::before{left:-6%}.afro::after{right:-6%}
.foe.burnt .afro{opacity:1;transform:scale(1)}
.foe.burnt .head{filter:brightness(.42) contrast(1.3)}
.foe.flash .foeIn{filter:brightness(3) saturate(0)}
.lumps{position:absolute;left:36%;width:28%;bottom:97%;z-index:1;display:flex;flex-direction:column-reverse;align-items:center;pointer-events:none}
.lumps i{display:block;aspect-ratio:1/.85;background:radial-gradient(circle at 35% 30%,#ffd0d0 0 18%,#ff8f8f 20%);border:3px solid var(--ink);border-radius:50% 50% 30% 30%;margin-bottom:-22%}
.lumps i:nth-child(1){width:100%;margin-bottom:-12%}.lumps i:nth-child(2){width:76%}.lumps i:nth-child(3){width:56%}.lumps i:nth-child(n+4){width:40%}
.flag{right:-8%;top:30%;font-size:clamp(28px,9vw,46px);transform-origin:20% 100%;animation:wave .5s infinite alternate}
.foe.ko .flag{opacity:1}
@keyframes drip{from{transform:translateY(-30%);opacity:0}30%{opacity:1}to{transform:translateY(60%)}}
@keyframes tear{to{height:27%}}
@keyframes orbit{from{transform:translateX(-6%) rotate(-5deg)}to{transform:translateX(6%) rotate(5deg)}}
@keyframes wave{to{transform:rotate(-70deg)}}

/* 我方、怒氣、必殺 */
.me{position:absolute;left:4%;bottom:8%;width:min(21cqw,18cqh);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);overflow:hidden;background:#ffd9b3;z-index:4;box-shadow:0 4px 0 var(--ink),0 0 0 3px var(--gold)}
.ntag{position:absolute;z-index:5;pointer-events:none;background:var(--panel);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:0 9px;font-weight:900;font-size:12.5px;line-height:1.5;white-space:nowrap;max-width:46cqw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 var(--ink)}
.ntag.metag{left:calc(4% + min(21cqw,18cqh)/2);bottom:6%;translate:-50% 0;background:var(--gold)}
.ntag.ftag{left:50%;top:102%;translate:-50% 0}
.foe.ko .ftag{opacity:0}
.who label.lb{font-size:12.5px;font-weight:900;color:var(--mute);margin-bottom:-5px}
.rage{position:absolute;left:4%;right:28%;bottom:2.5%;height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#3a3350;overflow:hidden;z-index:4;pointer-events:none}
.rage i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a3a,var(--hit));transition:width .2s}
.rage span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;letter-spacing:.2em;line-height:1}
.ult{position:absolute;right:4%;bottom:2.5%;width:min(21cqw,18cqh);aspect-ratio:1;border-radius:50%;z-index:6;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#8a84a0,#4a4463);color:#cfc9e0;font:900 clamp(15px,4.2vw,22px)/1.1 var(--body);box-shadow:0 5px 0 var(--ink);padding:0}
.ult.ready{background:radial-gradient(circle at 35% 30%,#ffe88a,var(--hit));color:#fff;-webkit-text-stroke:3px var(--ink);animation:pulse .5s infinite alternate}
.ult:active{transform:translateY(5px);box-shadow:none}
@keyframes pulse{to{box-shadow:0 5px 0 var(--ink),0 0 0 8px rgba(255,200,58,.55);transform:scale(1.07)}}

.bubble{position:absolute;z-index:7;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:6px 11px;font-weight:900;font-size:clamp(13px,3.6vw,17px);line-height:1.35;pointer-events:none;opacity:0;transform:scale(.5);transition:opacity .1s,transform .2s cubic-bezier(.5,1.9,.5,1)}
.bubble.on{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;width:14px;height:14px;background:inherit;border:solid var(--ink);border-width:0 3px 3px 0}
.bubble.foeb{right:4%;top:17%;max-width:62%;transform-origin:50% 100%}
.bubble.foeb::after{left:40%;bottom:-10px;transform:rotate(45deg)}
.bubble.meb{left:6%;bottom:31%;max-width:60%;background:#ffe88a;transform-origin:10% 100%}
.bubble.meb::after{left:16px;bottom:-10px;transform:rotate(45deg)}

/* 特效層 */
.fx{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.fx>*{position:absolute;left:0;top:0;will-change:transform,opacity}
.pop{font:400 34px/1 var(--display);color:var(--hit);-webkit-text-stroke:4px var(--ink);text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pop.crit{font-size:52px;color:var(--gold)}
.pop.word{font:900 clamp(24px,7vw,38px)/1 var(--body);color:#fff;-webkit-text-stroke:5px var(--ink)}
.pop.mind{font:900 20px/1 var(--body);color:#e0b8ff;-webkit-text-stroke:4px var(--ink)}
.ico{font-size:clamp(44px,13vw,70px);line-height:1}
.pt{font-size:clamp(18px,5vw,26px);line-height:1}
.pt.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.pt.key{font:900 11px/1 var(--body);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:3px 4px;box-shadow:0 2px 0 var(--ink)}
.bullet{width:18px;height:6px;border-radius:3px;background:var(--gold);border:1.5px solid var(--ink)}
.drop{width:11px;height:11px;border-radius:50%;background:#7fd0ff;border:2px solid var(--ink)}
.burst{width:28%;aspect-ratio:1;background:#fff36b;clip-path:polygon(50% 0,61% 28%,90% 12%,74% 40%,100% 50%,74% 60%,90% 88%,61% 72%,50% 100%,39% 72%,10% 88%,26% 60%,0 50%,26% 40%,10% 12%,39% 28%)}
.boom{width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#ffe24a 26% 50%,#ff8a2a 51% 72%,transparent 73%)}
.bolt{inset:0;width:100%;height:100%}
.slam{left:50%!important;top:42%!important;font:400 clamp(60px,20vw,110px)/1 var(--display);color:var(--gold);-webkit-text-stroke:7px var(--ink);text-shadow:0 7px 0 var(--hit);white-space:nowrap}
.flashbg{inset:0;width:100%;height:100%;background:#fff;opacity:0}
.cutin{left:-10%!important;top:30%!important;width:120%;height:30%;background:repeating-linear-gradient(90deg,var(--hit) 0 26px,#ff6a52 26px 34px,var(--hit-d) 34px 40px);border-block:5px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:14px}
.cutin .av{height:86%;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);overflow:hidden;box-shadow:0 0 0 4px var(--gold)}
.cutin b{font:900 clamp(26px,8vw,44px)/1 var(--body);color:#fff;-webkit-text-stroke:5px var(--ink);text-shadow:0 4px 0 var(--ink)}
.dim{inset:0;width:100%;height:100%;background:rgba(27,21,48,.55)}

/* K.O. 結算 */
.kobox{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(27,21,48,.6);cursor:default;padding:16px}
.result{background:var(--panel);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:18px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,300px);animation:drop .45s cubic-bezier(.4,1.7,.5,1)}
.result .rank{font:400 84px/.9 var(--display);color:var(--hit);-webkit-text-stroke:5px var(--ink);text-shadow:0 5px 0 var(--gold)}
.result .tag{font-weight:900;font-size:19px}
.result dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:2px 18px;width:100%;font-weight:700}
.result dd{margin:0;text-align:right;font:400 20px/1.3 var(--display);letter-spacing:.05em;font-variant-numeric:tabular-nums}
@keyframes drop{from{transform:translateY(-60%) scale(.6);opacity:0}}

/* 武器列與開罵列 */
.tray{display:grid;grid-auto-flow:column;grid-template-rows:auto;grid-auto-columns:54px;gap:5px;overflow-x:auto;padding:4px 3px 6px;margin-top:2px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray button{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 1px 3px;font-size:10.5px;min-width:0;border-radius:12px;line-height:1.25;white-space:nowrap;overflow:hidden}
.tray button span{font-size:24px;line-height:1.15}
.tray button[aria-pressed=true]{background:linear-gradient(#ffe88a,var(--gold));transform:translateY(-3px);box-shadow:0 7px 0 var(--ink),0 0 0 3px var(--hit)}
.cv{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.foe{transition:transform .4s cubic-bezier(.5,1.5,.5,1),scale .35s cubic-bezier(.5,1.7,.5,1)}
.foe.tiny{scale:.42;translate:-45% 14.5%}
.foe.frozen .foeIdle{animation-play-state:paused;filter:saturate(.7) brightness(1.1) hue-rotate(160deg)}
.foe.frozen::after{content:"";position:absolute;inset:-7% -5% -3%;z-index:6;background:linear-gradient(135deg,rgba(215,243,255,.7),rgba(120,200,255,.35) 45%,rgba(215,243,255,.6));border:3px solid #e6f7ff;border-radius:16% 16% 8% 8%;clip-path:polygon(8% 0,92% 0,100% 12%,100% 100%,0 100%,0 12%)}
.foe.sick .foeIdle{filter:hue-rotate(75deg) saturate(1.5)}
.tabs2{display:flex;gap:6px;margin-bottom:-4px}
.tabs2 .btn{flex:1;font-size:14px;padding:3px 6px;box-shadow:0 3px 0 var(--ink)}
.tabs2 .btn[aria-pressed=true]{background:linear-gradient(#ffe88a,var(--gold));color:var(--ink)}
.tray button.magic{background:linear-gradient(#fff6e6,#f2dcc8)}
.packs{display:flex;gap:6px;margin-bottom:-3px}
.packs .btn{flex:1;font-size:13px;padding:3px 6px;box-shadow:0 3px 0 var(--ink)}
.packs .btn[aria-pressed=true]{background:linear-gradient(#ffe88a,var(--gold));color:var(--ink)}
.yell{display:flex;gap:4px;overflow-x:auto;padding:1px 2px 5px;scrollbar-width:none}
.yell::-webkit-scrollbar{display:none}
.yell .btn{font-size:12.5px;padding:2px 7px;flex:none;border-radius:9px;box-shadow:0 3px 0 var(--ink)}
.yell .packsw{position:sticky;left:0;z-index:1;background:linear-gradient(#ffe88a,var(--gold))}
.has-btn .yell .btn:not(.tile){border-width:6px;border-image:var(--art-btn) 40 fill/6px;padding:0 3px}
.has-btn .top .btn:not(.tile),.has-btn .say .btn:not(.tile){border-width:8px;border-image:var(--art-btn) 40 fill/8px;padding:0 5px}
.has-btn .yell .btn.packsw{filter:sepia(1) saturate(3.2) hue-rotate(-12deg)}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:12px;padding:5px 10px;background:#fff}
.say .btn{padding:4px 12px}
.hint{margin:0;font-size:13px;color:var(--mute);text-align:center}

/* 設定抽屜 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(27,21,48,.6);display:flex;align-items:flex-end;justify-content:center}
.sheetIn{background:var(--panel);color:var(--ink);width:min(100%,592px);max-height:88%;overflow:auto;border:4px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheetIn header{display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font:900 19px/1.2 var(--body)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .th{width:84px;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);overflow:hidden;background:#ffd9b3;align-self:center}
.who input[type=text]{width:100%;min-width:0;border:2.5px solid var(--ink);border-radius:10px;padding:5px 6px;background:#fff;font-weight:700;text-align:center}

.art{background:var(--art) center/contain no-repeat!important;border-color:transparent!important;box-shadow:none!important;border-radius:0!important;clip-path:none!important}
.art.notext{color:transparent!important;-webkit-text-stroke:0!important;text-shadow:none!important}
.ult.art.ready,.tray button.art[aria-pressed=true]{background-image:var(--art-on,var(--art))!important}

function skin(el,id,noText){if(!ART[id])return false;el.classList.add('art');if(noText)el.classList.add('notext');el.style.setProperty('--art',`url("${ART[id]}")`);return true}
const artImg=id=>ART[id]?`<img src="${ART[id]}" alt="" draggable="false">`:'';
/* 身體零件跟著對方性別換:男生用 body/,女生用 body-f/,沒圖就退回程式畫的 */
function skinBody(){
  const dir=gender.foe==='f'?'body-f/':'body/';
  for(const k in BODY){const el=document.querySelector(BODY[k]);el.classList.remove('art');el.style.removeProperty('--art');skin(el,dir+k)}
}
function applyArt(id){
  const bp=id.split('/');if((bp[0]==='body'||bp[0]==='body-f')&&BODY[bp[1]])skinBody();
  if(STATIC[id])document.querySelectorAll(STATIC[id][0]).forEach(el=>skin(el,id,STATIC[id][1]));
  if(ON[id])document.querySelectorAll(ON[id]).forEach(el=>el.style.setProperty('--art-on',`url("${ART[id]}")`));
  if(ROOT.includes(id)){const k=id.split('/')[1];document.documentElement.classList.add('has-'+k);document.documentElement.style.setProperty('--art-'+k,`url("${ART[id]}")`)}
  if(id==='ui/bg')document.body.style.background=`#f1e3c2 url("${ART[id]}") center top/cover fixed`;
  if(id.startsWith('face/'))renderAv(id.slice(5).replace('-f',''));
  if(id.startsWith('weapon/')){const b=$('w-'+id.slice(7));if(b)b.firstChild.innerHTML=artImg(id)}
}
function loadArt(){
  const ids=[...Object.keys(BODY).flatMap(k=>['body/'+k,'body-f/'+k]),'face/me-f','face/foe-f',...Object.keys(STATIC),...Object.keys(ON),...ROOT,'ui/bg','ui/ko','ui/fight','face/me','face/foe','fx/burst','fx/boom','fx/bullet','fx/drop','fx/soul',
    ...WEAPONS.map(w=>'weapon/'+w.id),...Object.keys(WOUND).map(k=>'wound/'+k),...Object.values(PMAP).map(k=>'fx/p-'+k)];
  ids.forEach(id=>{const im=new Image();im.onload=()=>{ART[id]=im.src;applyArt(id)};im.src=ART_DIR+id+'.png'});
}

function renderAv(who){

    if(url)el.firstChild.src=url;

function readImg(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=256;
    const s=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);
    cb(c.toDataURL('image/jpeg',.85));
  };im.onerror=()=>note('這個檔案讀不出來,換一張 JPG 或 PNG 試試。');im.src=r.result};
  r.readAsDataURL(file);
}

/* 音效:音高下滑的短音 + 一點雜訊 */
let ac,noise;
function sfx(w,gain){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),v=gain||.2;
    o.type=w.t;o.frequency.setValueAtTime(w.f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,w.f/4),t+w.d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+w.d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+w.d);
    if(w.n){
      if(!noise){noise=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      const s=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();
      s.buffer=noise;f.type='lowpass';f.frequency.value=w.nf||1800;
      ng.gain.setValueAtTime(w.n*v*2,t);ng.gain.exponentialRampToValueAtTime(.001,t+w.d*.9);
      s.connect(f);f.connect(ng);ng.connect(ac.destination);s.start(t);s.stop(t+w.d);
    }
  }catch(e){}
}

function mk(cls,text){const d=document.createElement('div');d.className=cls;if(text!=null)d.textContent=text;fxL.appendChild(d);return d}
function run(el,frames,opt,keep){
  return new Promise(res=>{const a=el.animate(frames,Object.assign({fill:'forwards'},opt));a.onfinish=()=>{if(!keep)el.remove();res()}});
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function pop(cls,text,x,y,dy,ms){

  run(d,[{opacity:1,transform:T(x,y,`scale(${.3*s}) rotate(${r}deg)`)},{opacity:1,transform:T(x,y,`scale(${1.15*s}) rotate(${r+15}deg)`),offset:.5},{opacity:0,transform:T(x,y,`scale(${1.4*s}) rotate(${r+20}deg)`)}],{duration:300});

function parts(list,x,y,n){
  if(reduce)return; const u=U();
  for(let i=0;i<n;i++){
    const it=pick(list); let d;
    if(it[0]==='#'){d=mk('pt dot');d.style.background=it}
    else if(/^[A-Za-z0-9]+$/.test(it))d=mk('pt key',it);
    else{const a='fx/p-'+PMAP[it];d=mk('pt',ART[a]?null:it);if(ART[a])d.innerHTML=artImg(a)}
    const a=rnd(-Math.PI,0),dist=rnd(40,110)*u,dx=Math.cos(a)*dist,dy=Math.sin(a)*dist,rot=rnd(-360,360);
    run(d,[{opacity:1,transform:T(x,y,'scale(.4)')},{opacity:1,transform:T(x+dx*.7,y+dy,`scale(1) rotate(${rot*.6}deg)`),offset:.45},{opacity:0,transform:T(x+dx,y+dy+rnd(60,120)*u,`scale(.8) rotate(${rot}deg)`)}],{duration:rnd(550,900),easing:'ease-out'});
  }
}

function slam(text,ms,id){

function addWound(kind,px,py){

  s.innerHTML=artImg('wound/'+kind)||`<svg viewBox="0 0 40 40">${WOUND[kind]}</svg>`;
  wounds.appendChild(s);
  if(!reduce)s.animate([{transform:tf+' scale(0)'},{transform:tf+' scale(1.3)'},{transform:tf}],{duration:220});

function react(kind,dir){
  if(reduce)return;
  const [mid,dur]=REACT[kind](dir), end=kind==='blast'?`rotate(${dir*720}deg)`:'none';
  foeIn.animate(['none',...mid,end].map(t=>({transform:t})),{duration:dur,easing:'ease-out'});
  foe.classList.add('flash');setTimeout(()=>foe.classList.remove('flash'),70);

/* 被打時手腳各自以肩膀、髖部為軸甩動再彈回來 */
function jiggle(dir,amp){
  const sw=(sel,a,delay)=>{const el=foe.querySelector(sel);if(!el)return;const k=a*amp*(.8+Math.random()*.4);
    el.animate([{rotate:'0deg'},{rotate:k+'deg'},{rotate:-k*.6+'deg'},{rotate:k*.32+'deg'},{rotate:-k*.14+'deg'},{rotate:'0deg'}],{duration:720,delay,easing:'ease-out'})};
  sw('.arm.l',48*dir+12,0);sw('.arm.r',48*dir-12,40);sw('.leg.l',16*dir,60);sw('.leg.r',16*dir,100);

/* ===== 魔法:canvas 粒子特效 ===== */
const cv=$('cv'),cx=cv.getContext('2d');let PT=[],EM=[],raf=0,lastT=0;
function fitCv(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=stage.clientWidth*d;cv.height=stage.clientHeight*d;cx.setTransform(d,0,0,d,0,0)}
if(window.ResizeObserver)new ResizeObserver(fitCv).observe(stage);fitCv();
function puff(o){PT.push(Object.assign({vx:0,vy:0,g:0,drag:1,life:.6,size:6,grow:0,col:'#fff',add:1,shape:'c',rot:0,vr:0,t:0,alpha:1,w:5},o));kick()}
function kick(){if(!raf){lastT=performance.now();raf=requestAnimationFrame(tick)}}
function tick(now){
  const dt=Math.min(.034,(now-lastT)/1000);lastT=now;
  cx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  EM=EM.filter(e=>e(dt)!==false);
  for(const p of PT){
    p.t+=dt;
    if(p.orb){p.rad-=p.pull*dt*(1+p.t*4);p.ang+=p.spin*dt;p.x=p.ox+Math.cos(p.ang)*p.rad;p.y=p.oy+Math.sin(p.ang)*p.rad*.8;if(p.rad<4)p.t=p.life}
    else{const k=Math.pow(p.drag,dt*60);p.vx*=k;p.vy=p.vy*k+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
    p.rot+=p.vr*dt;
    const a=1-p.t/p.life,sz=Math.max(.5,p.size+p.grow*p.t);if(a<=0)continue;
    cx.globalAlpha=a*p.alpha;cx.globalCompositeOperation=p.add?'lighter':'source-over';cx.fillStyle=cx.strokeStyle=p.col;
    if(p.shape==='c'){cx.beginPath();cx.arc(p.x,p.y,sz,0,6.283);cx.fill()}
    else if(p.shape==='ring'){cx.lineWidth=p.w*a+1;cx.beginPath();cx.arc(p.x,p.y,sz,0,6.283);cx.stroke()}
    else if(p.shape==='spark'){cx.lineWidth=sz;cx.lineCap='round';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);cx.stroke()}
    else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      if(p.shape==='sq')cx.fillRect(-sz,-sz,sz*2,sz*2);
      else if(p.shape==='shard'){cx.beginPath();cx.moveTo(0,-sz*1.6);cx.lineTo(sz*.6,sz);cx.lineTo(-sz*.6,sz);cx.closePath();cx.fill()}
      else{cx.lineWidth=Math.max(1,sz*.35);cx.lineCap='round';cx.beginPath();for(let i=0;i<4;i++){const q=i*.785;cx.moveTo(-Math.cos(q)*sz,-Math.sin(q)*sz);cx.lineTo(Math.cos(q)*sz,Math.sin(q)*sz)}cx.stroke()}
      cx.restore()}
  }
  PT=PT.filter(p=>p.t<p.life);
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  if(PT.length||EM.length)raf=requestAnimationFrame(tick);else{raf=0;cx.clearRect(0,0,stage.clientWidth,stage.clientHeight)}
}
/* 跑 dur 秒的時間軸,fn(k) 每格被叫一次(k 從 0 到 1),可以直接畫圖或噴粒子 */
function anim(dur,fn,delay){
  return new Promise(res=>{let t=-(delay||0);EM.push(dt=>{t+=dt;if(t<0)return;const k=Math.min(1,t/dur);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';fn(k,dt);if(k>=1){res();return false}});kick()});
}
function boom(x,y,cols,n,sp,u){

  puff({x,y,shape:'ring',size:8*u,grow:480*u,life:.42,w:8*u});
}

/* 武器飛過去的過程,回傳命中時刻 */
function meXY(){const m=$('me').getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:m.left-s.left+m.width/2,y:m.top-s.top+m.height/2}}
async function launch(w,to){
  if(reduce)return;
  const u=U(),from=meXY(),ang=Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI;
  const lunge=()=>$('me').animate([{transform:'none'},{transform:`translate(${22*u}px,${-14*u}px) scale(1.12)`},{transform:'none'}],{duration:230});
  if(w.fly==='magic'){
    lunge();const o=stage.clientLeft,f=foe.getBoundingClientRect(),s=stage.getBoundingClientRect();
    const fr={b:f.bottom-s.top-o,h:f.height},fc={x:f.left-s.left-o+f.width/2,y:f.top-s.top-o+f.height/2};
    await MAGIC[w.id]({x:from.x-o,y:from.y-o-20*u},{x:to.x-o,y:to.y-o},fc,fr,u);
  }else if(w.fly==='melee'||w.fly==='stick'){
    lunge(); const d=ico('weapon/'+w.id,w.ico);
    await run(d,[{opacity:.2,transform:T(to.x-110*u,to.y+40*u,'scale(2.3) rotate(-30deg)')},{opacity:1,transform:T(to.x,to.y,'scale(1)')}],{duration:110,easing:'ease-in'},true);
    if(w.fly==='stick')run(d,[{transform:T(to.x,to.y,'scale(1)')},{transform:T(to.x-14*u,to.y-10*u,'scale(1.15)'),offset:.75},{opacity:1,transform:T(to.x-120*u,to.y-80*u,'scale(1) rotate(-200deg)'),offset:.95},{opacity:0,transform:T(to.x-140*u,to.y-60*u,'rotate(-240deg)')}],{duration:620});
    else run(d,[{opacity:1,transform:T(to.x,to.y,'scale(1)')},{opacity:0,transform:T(to.x-30*u,to.y+10*u,'scale(1.3)')}],{duration:170});
  }else if(w.fly==='throw'){
    lunge(); const d=ico('weapon/'+w.id,w.ico),mx=(from.x+to.x)/2,my=Math.min(from.y,to.y)-70*u;
    await run(d,[{transform:T(from.x,from.y,'scale(.5)')},{transform:T(mx,my,'scale(1) rotate(300deg)')},{transform:T(to.x,to.y,'scale(1) rotate(680deg)')}],{duration:250},true);
    run(d,[{opacity:1,transform:T(to.x,to.y,'rotate(680deg)')},{opacity:1,transform:T(to.x-40*u,to.y-50*u,'rotate(900deg)'),offset:.4},{opacity:0,transform:T(to.x-70*u,to.y+110*u,'rotate(1100deg)')}],{duration:520,easing:'ease-in'});
  }else if(w.fly==='shots'){
    const g=ico('weapon/'+w.id,'🔫'),fl=ART['weapon/'+w.id]?'scale(.8,.8)':'scale(-.8,.8)',gx=from.x+40*u,gy=from.y-34*u;
    run(g,[{opacity:1,transform:T(gx,gy,fl)},{opacity:1,transform:T(gx-10*u,gy-6*u,fl+' rotate(-18deg)'),offset:.3},{opacity:1,transform:T(gx,gy,fl),offset:.8},{opacity:0,transform:T(gx,gy,fl)}],{duration:330});
    const n=w.id==='gun'?3:7,cls=w.id==='gun'?'bullet':'drop';
    for(let i=0;i<n;i++)setTimeout(()=>{
      const b=mk(cls),jx0=skin(b,'fx/'+cls),jx=rnd(-12,12)*u,jy=rnd(-12,12)*u;
      run(b,[{transform:T(gx+20*u,gy,`rotate(${ang}deg)`)},{transform:T(to.x+jx,to.y+jy,`rotate(${ang}deg)`)}],{duration:120,easing:'linear'});
    },i*38);
    await wait(120);
  }else if(w.fly==='sky'){
    let x=to.x+rnd(-40,40)*u,y=0,p=`${x},0`;
    while(y<to.y-30*u){y+=rnd(26,46)*u;x+=rnd(-34,34)*u;p+=` ${x},${y}`} p+=` ${to.x},${to.y}`;
    const b=mk('bolt');b.innerHTML=`<svg width="100%" height="100%"><polyline points="${p}" fill="none" stroke="#1b1530" stroke-width="13" stroke-linejoin="round"/><polyline points="${p}" fill="none" stroke="#fff36b" stroke-width="7" stroke-linejoin="round"/></svg>`;
    run(b,[{opacity:1},{opacity:.2},{opacity:1},{opacity:0}],{duration:260});
    await wait(50);
  }else if(w.fly==='rocket'){
    lunge(); const d=ico('weapon/'+w.id,w.ico);
    const puff=setInterval(()=>{const r=d.getBoundingClientRect(),s=stage.getBoundingClientRect();parts(['💨'],r.left-s.left+r.width/2,r.top-s.top+r.height/2,1)},45);
    await run(d,[{transform:T(from.x,from.y-20*u,`rotate(${ang+45}deg) scale(.6)`)},{transform:T(to.x,to.y,`rotate(${ang+45}deg) scale(1.1)`)}],{duration:330,easing:'ease-in'});
    clearInterval(puff);
  }
}

/* 數值與介面 */
function hud(){
  $('foeLabel').textContent=nm('foe');$('foeTag').textContent=nm('foe');$('meTag').textContent=nm('me');$('hpNum').textContent=Math.max(0,Math.round(hp))+' / '+MAXHP;
  const pc=hp/MAXHP*100,w=Math.max(0,pc)+'%';$('hpBar').style.width=w;$('hpGhost').style.width=w;
  $('hpBar').style.background=pc>60?'linear-gradient(#8dffbf,#35d07f)':pc>30?'linear-gradient(#ffe27a,#ffb020)':'linear-gradient(#ff8a9a,#ff3d5a)';
  foe.classList.toggle('s1',pc<=75);foe.classList.toggle('s2',pc<=45);foe.classList.toggle('s3',pc<=20&&!isKO);
  foe.classList.toggle('beg',pc<=45&&!isKO);
  $('rageBar').style.width=rage+'%';$('ult').classList.toggle('ready',rage>=100&&!isKO);
  $('score').textContent=stats.score;
  $('stats').textContent=`累計出手 ${stats.hits} 次|擊倒 ${stats.ko} 次|消氣值 ${stats.score}`;
}
function addScore(n){
  stats.score+=n;roundScore+=n;
  if(!reduce)$('score').animate([{transform:'scale(1.5)',color:'#ffc83a'},{transform:'scale(1)'}],{duration:220});
}
function bumpCombo(){
  const now=performance.now();combo=now-lastHit<1300?combo+1:1;lastHit=now;maxCombo=Math.max(maxCombo,combo);
  const c=$('combo');c.hidden=combo<2;c.innerHTML=combo+'<small>連擊</small>';
  if(!reduce&&combo>=2)c.animate([{transform:'scale(1.7) rotate(-6deg)'},{transform:'scale(1)'}],{duration:180});
  clearTimeout(timers.combo);timers.combo=setTimeout(()=>{c.hidden=true;combo=0},1400);
}
function hurt(dmg,line){
  if(isKO)return;
  hp-=dmg;stats.hits++;roundHits++;addScore(dmg*10);
  rage=Math.min(100,rage+dmg*.5+combo*.4);
  if(hp<=0){hp=0;knockout()}
  else if(line||Math.random()<.7)say('foeSay',fill(line||pick(hp>MAXHP*.6?BEG.hi:hp>MAXHP*.3?BEG.mid:BEG.lo)));
  store.set('stats',stats);hud();
}
function knockout(){
  isKO=true;stopHold();stats.ko++;addScore(500);
  foe.classList.remove('frozen','sick','tiny');foe.classList.add('ko');say('foeSay',fill(pick(BEG.ko)),3500);
  sfx({f:90,d:.7,t:'sawtooth',n:.6,nf:700},.3);buzz([60,40,120]);
  const fr=foe.getBoundingClientRect(),sr=stage.getBoundingClientRect(),x=fr.left-sr.left+fr.width/2,y=fr.top-sr.top+fr.height/2;
  const soul=ico('fx/soul','👻');run(soul,[{opacity:0,transform:T(x,y,'scale(.4)')},{opacity:1,transform:T(x+20,y-80,'scale(1) rotate(8deg)'),offset:.3},{opacity:1,transform:T(x-20,y-170,'rotate(-8deg)'),offset:.7},{opacity:0,transform:T(x+10,y-260,'scale(1.1)')}],{duration:2200});
  flashBg(.8);shake(12);slam('K.O.',1100,'ui/ko');
  parts(['#ffc83a','#ff3d5a','#3aa0ff','#35d07f','⭐'],sr.width/2,sr.height*.3,reduce?0:26);
  const secs=Math.max(1,Math.round((performance.now()-roundStart)/1000));
  const rank=maxCombo>=15?['S','神清氣爽']:maxCombo>=8?['A','通體舒暢']:['B','還有點悶,再來一輪'];
  $('rRank').textContent=rank[0];$('rTag').textContent=rank[1];
  $('rHits').textContent=roundHits;$('rCombo').textContent=maxCombo;$('rTime').textContent=secs+'s';$('rScore').textContent='+'+roundScore;
  setTimeout(()=>{if(isKO)$('ko').hidden=false},1300);
}

/* 命中 */
function impact(w,px,py,to,opt){
  if(isKO)return; opt=opt||{};
  const crit=!opt.noCrit&&Math.random()<.14;
  let dmg=opt.dmg||Math.round(rnd(w.dmg[0],w.dmg[1]))+(py<55?2:0); if(crit)dmg*=2;
  const u=U();
  sfx(w,crit?.3:.2);buzz(crit?40:15);bumpCombo();
  if(!w.magic)burst(to.x,to.y,crit);
  pop('word',w.word,to.x+rnd(-40,40)*u,to.y-46*u,-34*u,650);
  pop(crit?'crit':'',crit?`爆擊 -${dmg}`:`-${dmg}`,to.x,to.y+6*u,-80*u,850);
  if(w.parts.length)parts(w.parts,to.x,to.y,crit?7:4);
  addWound(w.wound,px,py);
  if(w.id==='pan'&&py<55)addLump();
  if(w.react==='shock'||w.react==='blast'||w.burn){burn();flashBg(w.id==='fire'?.4:.85)}
  if(w.status&&!opt.quiet)applyStatus(w.status);
  if(w.fly==='rocket'){const b=mk('boom');skin(b,'fx/boom');run(b,[{opacity:1,transform:T(to.x,to.y,'scale(.2)')},{opacity:1,transform:T(to.x,to.y,'scale(2.6)'),offset:.6},{opacity:0,transform:T(to.x,to.y,'scale(3.4)')}],{duration:420})}
  react(opt.react||w.react,px<50?1:-1);
  shake(crit?10:Math.min(9,3+dmg*.35));
  hurt(dmg,!opt.quiet&&Math.random()<.45?pick(w.say):null);
}
function target(cx,cy){
  const sr=stage.getBoundingClientRect(),fr=foe.getBoundingClientRect();let px,py;
  if(cx>=fr.left&&cx<=fr.right&&cy>=fr.top&&cy<=fr.bottom){px=(cx-fr.left)/fr.width*100;py=(cy-fr.top)/fr.height*100}
  else{px=rnd(25,75);py=rnd(8,80)}
  return{px,py,to:{x:fr.left-sr.left+fr.width*px/100,y:fr.top-sr.top+fr.height*py/100}};
}
async function attack(cx,cy){
  if(isKO||busy)return;
  const w=weapon;
  if(w.magic){if(casting)return;casting=true}
  const t=target(cx,cy);
  try{await launch(w,t.to)}finally{if(w.magic)casting=false}
  if(!busy)impact(w,t.px,t.py,t.to);
}
function insult(text){
  if(isKO||busy||!text)return;
  say('meSay',text,1700);sfx({f:420,d:.18,t:'square'});
  const fr=foe.getBoundingClientRect(),sr=stage.getBoundingClientRect(),dmg=Math.round(rnd(3,7));
  const x=fr.left-sr.left+fr.width/2,y=fr.top-sr.top+fr.height*.62;
  addWound('heart',rnd(38,62),rnd(60,74));
  pop('mind',`心靈傷害 -${dmg}`,x,y,-80*U(),950);parts(['💔','💧'],x,y,3);
  react('stretch',1);bumpCombo();hurt(dmg,pick(BEG.hurt));
}
/* 必殺:過場 → 亂打十幾下 → 收尾大爆炸 */
async function ultimate(){
  if(rage<100||isKO||busy)return;
  busy=true;stopHold();rage=0;hud();
  sfx({f:200,d:.5,t:'sawtooth',n:.3},.25);
  if(!reduce){
    const dim=mk('dim');run(dim,[{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.85},{opacity:0}],{duration:900});
    const c=mk('cutin');c.innerHTML=`<div class="av">${$('me').innerHTML}</div><b>怒氣爆發!!</b>`;
    await run(c,[{transform:'translateX(-110%) skewY(-6deg)'},{transform:'translateX(-2%) skewY(-6deg)',offset:.2},{transform:'translateX(2%) skewY(-6deg)',offset:.8},{transform:'translateX(110%) skewY(-6deg)'}],{duration:900});
  }
  for(let i=0;i<14&&!isKO;i++){
    const w=pick(WEAPONS.filter(x=>!x.magic)),t=target(-1,-1);
    const d=ico('weapon/'+w.id,w.ico);run(d,[{opacity:1,transform:T(t.to.x,t.to.y,'scale(1.8)')},{opacity:0,transform:T(t.to.x,t.to.y,'scale(.9)')}],{duration:200});
    impact(w,t.px,t.py,t.to,{dmg:Math.round(rnd(4,7)),noCrit:true,quiet:true,react:pick(['knock','slap','tiny','shiver'])});
    await wait(75);
  }
  if(!isKO){
    const t=target(-1,-1),w=WEAPONS.find(x=>x.id==='rocket');
    slam('必殺!',700);await wait(180);
    impact(w,50,40,t.to,{dmg:40,noCrit:true});
  }
  rage=0;busy=false;hud();
}
function intro(){
  round++;
  if(reduce)return;
  foeIn.animate([{transform:'translateY(-220%)'},{transform:'translateY(0) scale(1.25,.7)',offset:.6},{transform:'translateY(-6%) scale(.95,1.06)',offset:.8},{transform:'none'}],{duration:620,easing:'ease-in'});
  slam('ROUND '+round,650).then(()=>slam('FIGHT!',600,'ui/fight'));
}
function newRound(keepScene){
  hp=MAXHP;isKO=false;busy=false;combo=0;maxCombo=0;rage=0;roundHits=0;roundScore=0;lumpN=0;roundStart=performance.now();
  wounds.innerHTML='';$('lumps').innerHTML='';foe.classList.remove('ko','burnt','frozen','sick','tiny');clearInterval(timers.dot);$('ko').hidden=true;$('combo').hidden=true;
  ['foeSay','meSay'].forEach(i=>$(i).classList.remove('on'));
  if(!keepScene)nextScene();hud();intro();
  setTimeout(()=>{if(!isKO&&roundHits===0)say('foeSay',pick(BEG.start),2600)},1300);
}

/* 操作:點一下出手,按住連打 */
let hold=null,pt={x:0,y:0};
function stopHold(){clearInterval(hold);hold=null}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,.kobox'))return;
  pt={x:e.clientX,y:e.clientY};attack(pt.x,pt.y);
  stopHold();hold=setInterval(()=>attack(pt.x,pt.y),175);
});
stage.addEventListener('pointermove',e=>{pt={x:e.clientX,y:e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(n=>stage.addEventListener(n,stopHold));
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.tabIndex=0;
stage.addEventListener('keydown',e=>{if(e.target===stage&&(e.key===' '||e.key==='Enter')){e.preventDefault();attack(-1,-1)}});
$('ult').addEventListener('click',ultimate);
$('again').addEventListener('click',()=>newRound(false));
$('btnHeal').addEventListener('click',()=>{$('sheet').hidden=true;newRound(true)});
$('btnScene').addEventListener('click',nextScene);
$('btnSet').addEventListener('click',()=>{$('sheet').hidden=false;$('sheetX').focus()});
$('sheetX').addEventListener('click',()=>{$('sheet').hidden=true});
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').hidden=true});
const mb=$('btnMute');const muteLabel=()=>{mb.textContent=muted?'♪✕':'♪';mb.setAttribute('aria-pressed',!muted)};muteLabel();
mb.addEventListener('click',()=>{muted=!muted;store.set('mute',muted);muteLabel()});

const wbox=$('weapons');
WEAPONS.forEach(w=>{
  const b=document.createElement('button');b.type='button';b.className='btn tile'+(w.magic?' magic':'');b.id='w-'+w.id;
  b.innerHTML=`<span aria-hidden="true">${w.ico}</span>${w.name}`;
  b.setAttribute('aria-pressed',w===weapon);
  b.addEventListener('click',()=>{weapon=w;store.set('weapon',w.id);[...wbox.children].forEach(c=>c.setAttribute('aria-pressed',c===b));sfx({f:900,d:.05,t:'sine'},.1)});
  wbox.appendChild(b);
});
const savedW=store.get('weapon',null),sw=WEAPONS.find(w=>w.id===savedW);
if(sw){weapon=sw;[...wbox.children].forEach(c=>c.setAttribute('aria-pressed',c.id==='w-'+sw.id))}

function renderInsults(){
  const box=$('insults');box.innerHTML='';
  const chip=t=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=t;b.addEventListener('click',()=>insult(t));return b};
  custom.forEach(t=>{ // 自己寫的:存在瀏覽器裡,旁邊可以刪
    const w=document.createElement('span');w.className='cchip';w.appendChild(chip(t));
    const x=document.createElement('button');x.type='button';x.className='btn del';x.textContent='✕';x.setAttribute('aria-label','刪掉「'+t+'」');
    x.addEventListener('click',()=>{custom=custom.filter(c=>c!==t);store.set('custom',custom);renderInsults()});
    w.appendChild(x);box.appendChild(w);
  });
  PACKS[pack].forEach(t=>box.appendChild(chip(t)));
  // 最前面那顆是語系切換:點一下換下一組
  const sw=document.createElement('button');sw.type='button';sw.className='btn packsw';sw.textContent=pack+' ⇄';sw.setAttribute('aria-label','切換髒話語系,目前是'+pack);
  sw.addEventListener('click',()=>{const ks=Object.keys(PACKS);pack=ks[(ks.indexOf(pack)+1)%ks.length];store.set('pack',pack);renderInsults();box.scrollLeft=0});
  box.prepend(sw);
}
$('sayForm').addEventListener('submit',e=>{
  e.preventDefault();const t=$('sayText').value.trim();if(!t)return;
  insult(t);
  if(!custom.includes(t)&&!INSULTS.includes(t)){custom=[t,...custom].slice(0,30);store.set('custom',custom);renderInsults();$('insults').scrollLeft=0}
  $('sayText').value='';
});

foe.classList.toggle('f',gender.foe==='f');renderAv('me');renderAv('foe');renderInsults();newRound(false);loadArt();
})();
</script>
